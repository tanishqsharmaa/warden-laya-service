apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: warden-laya-service-hpa
  namespace: warden-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: warden-laya-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  - type: Pods
    pods:
      metric:
        name: inference_active_slots
      target:
        type: AverageValue
        averageValue: "10"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
